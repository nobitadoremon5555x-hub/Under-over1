<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under/Over 7 Signal Bot - Melbet Style</title>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC7yXmliI0SrWJ5EaFvo88-p9NI43r2pcY",
            authDomain: "under-ovar.firebaseapp.com",
            projectId: "under-ovar",
            storageBucket: "under-ovar.firebasestorage.app",
            messagingSenderId: "132175276301",
            appId: "1:132175276301:web:dec533442c62d4c49ea844",
            measurementId: "G-C4T8PB4WV8"
        };
        
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        // DOM Elements
        const loginSection = document.getElementById("loginSection");
        const appSection = document.getElementById("appSection");
        const userEmail = document.getElementById("userEmail");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const melbetIdInput = document.getElementById("melbetId");
        const saveMelbetBtn = document.getElementById("saveMelbetBtn");
        const melbetStatus = document.getElementById("melbetStatus");
        
        const underBtn = document.getElementById("underBtn");
        const equalBtn = document.getElementById("equalBtn");
        const overBtn = document.getElementById("overBtn");
        const betResult = document.getElementById("betResult");
        
        const underStat = document.getElementById("underStat");
        const overStat = document.getElementById("overStat");
        const equalStat = document.getElementById("equalStat");
        const totalStat = document.getElementById("totalStat");
        
        // ============= Authentication =============
        const ALLOWED_EMAIL = "kholilkhan5555@gmail.com";
        
        onAuthStateChanged(auth, (user) => {
            console.log("Auth state:", user?.email);
            if (user && user.email === ALLOWED_EMAIL) {
                loginSection.style.display = "none";
                appSection.style.display = "block";
                userEmail.textContent = user.email;
                loadMelbetId(user.uid);
                listenToStats();
            } else {
                if (user && user.email !== ALLOWED_EMAIL) {
                    signOut(auth);
                    alert("Access denied!");
                }
                loginSection.style.display = "block";
                appSection.style.display = "none";
            }
        });
        
        loginBtn.addEventListener("click", async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                if (result.user.email !== ALLOWED_EMAIL) {
                    await signOut(auth);
                    alert("Access denied!");
                }
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });
        
        logoutBtn.addEventListener("click", async () => {
            await signOut(auth);
        });
        
        // ============= Melbet ID =============
        async function loadMelbetId(uid) {
            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    melbetIdInput.value = data.melbetId || "";
                    melbetStatus.textContent = data.melbetId ? "✅ Active" : "⚠️ Not set";
                    melbetStatus.style.color = data.melbetId ? "#00e676" : "#ffa726";
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        saveMelbetBtn.addEventListener("click", async () => {
            const user = auth.currentUser;
            if (!user) return alert("Login first!");
            const melbetId = melbetIdInput.value.trim();
            if (!melbetId) return alert("Enter Melbet ID!");
            
            melbetStatus.textContent = "⏳ Saving...";
            melbetStatus.style.color = "#ffeb3b";
            
            try {
                await setDoc(doc(db, "users", user.uid), { 
                    melbetId, 
                    email: user.email,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                melbetStatus.textContent = "✅ Active";
                melbetStatus.style.color = "#00e676";
                alert("Saved!");
                await loadMelbetId(user.uid);
            } catch (e) {
                melbetStatus.textContent = "❌ Failed";
                melbetStatus.style.color = "#ff1744";
                alert("Failed: " + e.message);
            }
        });
        
        // ============= Stats =============
        async function listenToStats() {
            const statsRef = doc(db, "stats", "counts");
            onSnapshot(statsRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    underStat.textContent = data.under || 0;
                    overStat.textContent = data.over || 0;
                    equalStat.textContent = data.equal || 0;
                    totalStat.textContent = (data.under || 0) + (data.over || 0) + (data.equal || 0);
                }
            });
        }
        
        async function updateStats(result) {
            const statsRef = doc(db, "stats", "counts");
            const docSnap = await getDoc(statsRef);
            let data = docSnap.exists() ? docSnap.data() : { under: 0, over: 0, equal: 0 };
            data[result] = (data[result] || 0) + 1;
            await setDoc(statsRef, data);
        }
        
        function getPrediction() {
            const rand = Math.random() * 100;
            if (rand < 47) return "Under 7";
            if (rand < 94) return "Over 7";
            return "Equal 7";
        }
        
        function showResult(prediction) {
            const colors = {
                "Under 7": "#00e676",
                "Over 7": "#ff1744",
                "Equal 7": "#ffea00"
            };
            const emojis = {
                "Under 7": "⬇️",
                "Over 7": "⬆️",
                "Equal 7": "⚖️"
            };
            const desc = {
                "Under 7": "2-6 Goals",
                "Over 7": "8-12 Goals",
                "Equal 7": "Exactly 7 Goals"
            };
            
            betResult.innerHTML = `
                <div style="font-size:3rem;">${emojis[prediction]}</div>
                <div style="font-size:2rem;font-weight:700;color:${colors[prediction]};">
                    ${prediction}
                </div>
                <div style="font-size:0.9rem;color:#aaa;margin-top:4px;">${desc[prediction]}</div>
                <div style="font-size:0.7rem;color:#666;margin-top:8px;">
                    ⚡ Signal generated
                </div>
            `;
        }
        
        async function placeBet(prediction) {
            const user = auth.currentUser;
            if (!user) return alert("Login first!");
            const melbetId = melbetIdInput.value.trim();
            if (!melbetId) return alert("Set Melbet ID first!");
            
            showResult(prediction);
            const map = { "Under 7": "under", "Over 7": "over", "Equal 7": "equal" };
            await updateStats(map[prediction]);
            console.log(`[${new Date().toISOString()}] ${prediction} | ${melbetId}`);
        }
        
        underBtn.addEventListener("click", () => placeBet("Under 7"));
        equalBtn.addEventListener("click", () => placeBet("Equal 7"));
        overBtn.addEventListener("click", () => placeBet("Over 7"));
        document.getElementById("autoSignalBtn").addEventListener("click", () => {
            placeBet(getPrediction());
        });
        
        console.log("🚀 App Ready!");
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0e17;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            background: linear-gradient(180deg, #0f1a2a 0%, #0a0e17 100%);
            border-radius: 28px;
            padding: 20px 20px 24px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        
        /* Glow effect */
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0, 200, 255, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            padding: 8px 0 12px;
            position: relative;
            z-index: 1;
        }
        
        .header .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .header .logo .ball {
            font-size: 2rem;
        }
        
        .header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        
        .header .subtitle {
            font-size: 0.7rem;
            color: #4a5a6e;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }
        
        /* Login Section */
        #loginSection {
            padding: 40px 16px;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        #loginSection .lock-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        #loginSection h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        #loginSection p {
            color: #6a7a8e;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        
        .btn-google {
            background: #1a2634;
            border: 1px solid #2a3a4a;
            color: #fff;
            padding: 14px 32px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        
        .btn-google:hover {
            background: #2a3a4a;
            border-color: #4a6a8a;
            transform: scale(1.02);
        }
        
        /* User Bar */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 4px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 1;
        }
        
        .user-bar .email {
            font-size: 0.75rem;
            color: #6a7a8e;
            font-weight: 500;
        }
        
        .user-bar .email span {
            color: #8a9aae;
        }
        
        .btn-logout {
            background: rgba(255, 23, 68, 0.15);
            border: none;
            color: #ff1744;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-logout:hover {
            background: rgba(255, 23, 68, 0.25);
        }
        
        /* Melbet ID Section */
        .melbet-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        
        .melbet-box .label {
            font-size: 0.7rem;
            color: #4a5a6e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        
        .melbet-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            padding: 6px 0;
            min-width: 80px;
        }
        
        .melbet-box input::placeholder {
            color: #3a4a5e;
            font-weight: 400;
        }
        
        .melbet-box .btn-save {
            background: linear-gradient(135deg, #00c853, #00e676);
            border: none;
            color: #0a0e17;
            padding: 6px 16px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .melbet-box .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }
        
        .melbet-box .status {
            font-size: 0.65rem;
            font-weight: 600;
            white-space: nowrap;
        }
        
        /* Bet Grid - Melbet Style */
        .bet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 16px 0;
            position: relative;
            z-index: 1;
        }
        
        .bet-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .bet-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 16px 16px;
        }
        
        .bet-card.under::before { background: linear-gradient(90deg, #00c853, #00e676); }
        .bet-card.equal::before { background: linear-gradient(90deg, #ffea00, #ffd600); }
        .bet-card.over::before { background: linear-gradient(90deg, #ff1744, #ff5252); }
        
        .bet-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        
        .bet-card:active {
            transform: scale(0.96);
        }
        
        .bet-card .bet-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.3px;
        }
        
        .bet-card .bet-odds {
            font-size: 0.7rem;
            color: #6a7a8e;
            font-weight: 600;
            margin-top: 4px;
            display: block;
        }
        
        .bet-card .bet-odds span {
            color: #ffd600;
            font-weight: 700;
        }
        
        .bet-card.under .bet-odds span { color: #00e676; }
        .bet-card.equal .bet-odds span { color: #ffd600; }
        .bet-card.over .bet-odds span { color: #ff5252; }
        
        /* Auto Signal Button */
        .btn-auto-signal {
            width: 100%;
            background: linear-gradient(135deg, #7c4dff, #651fff);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-auto-signal:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(101, 31, 255, 0.3);
        }
        
        .btn-auto-signal .badge {
            background: rgba(255,255,255,0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
        }
        
        /* Result Box */
        .result-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            transition: all 0.3s;
        }
        
        .result-box .placeholder {
            color: #3a4a5e;
            font-size: 0.85rem;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
            position: relative;
            z-index: 1;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        
        .stat-item .number {
            font-size: 1.5rem;
            font-weight: 800;
            display: block;
            line-height: 1.2;
        }
        
        .stat-item .stat-label {
            font-size: 0.6rem;
            color: #4a5a6e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-item.under .number { color: #00e676; }
        .stat-item.over .number { color: #ff5252; }
        .stat-item.equal .number { color: #ffd600; }
        .stat-item.total .number { color: #448aff; }
        
        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.6rem;
            color: #2a3a4a;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.04);
            position: relative;
            z-index: 1;
            letter-spacing: 0.5px;
        }
        
        .footer span {
            color: #ff6b35;
        }
        
        #loginSection { display: none; }
        #appSection { display: none; }
        
        /* Responsive */
        @media (max-width: 400px) {
            .container { padding: 16px; }
            .bet-card .bet-label { font-size: 0.75rem; }
            .stat-item .number { font-size: 1.2rem; }
            .melbet-box { flex-wrap: wrap; gap: 6px; }
            .melbet-box input { min-width: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span class="ball">⚽</span>
                <h1>Under / Over 7</h1>
            </div>
            <div class="subtitle">Signal Bot v2.0</div>
        </div>
        
        <!-- Login Section -->
        <div id="loginSection">
            <div class="lock-icon">🔐</div>
            <h2>Welcome Back</h2>
            <p>Sign in with your Google account to continue</p>
            <button class="btn-google" id="loginBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>
        
        <!-- App Section -->
        <div id="appSection">
            
            <!-- User Bar -->
            <div class="user-bar">
                <div class="email">👤 <span id="userEmail">user@gmail.com</span></div>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
            
            <!-- Melbet ID -->
            <div class="melbet-box">
                <span class="label">🎰 ID</span>
                <input type="text" id="melbetId" placeholder="Enter Melbet ID" />
                <button class="btn-save" id="saveMelbetBtn">Save</button>
                <span class="status" id="melbetStatus">⚠️ Not set</span>
            </div>
            
            <!-- Bet Grid -->
            <div class="bet-grid">
                <div class="bet-card under" id="underBtn">
                    <div class="bet-label">Under 7</div>
                    <div class="bet-odds">Odds <span>x 2.3</span></div>
                </div>
                <div class="bet-card equal" id="equalBtn">
                    <div class="bet-label">Equal 7</div>
                    <div class="bet-odds">Odds <span>x 5.8</span></div>
                </div>
                <div class="bet-card over" id="overBtn">
                    <div class="bet-label">Over 7</div>
                    <div class="bet-odds">Odds <span>x 2.3</span></div>
                </div>
            </div>
            
            <!-- Auto Signal -->
            <button class="btn-auto-signal" id="autoSignalBtn">
                🎯 Auto Signal
                <span class="badge">47/47/6</span>
            </button>
            
            <!-- Result -->
            <div class="result-box" id="betResult">
                <div class="placeholder">Select an option above to get signal</div>
            </div>
            
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-item under">
                    <span class="number" id="underStat">0</span>
                    <span class="stat-label">Under</span>
                </div>
                <div class="stat-item equal">
                    <span class="number" id="equalStat">0</span>
                    <span class="stat-label">Equal</span>
                </div>
                <div class="stat-item over">
                    <span class="number" id="overStat">0</span>
                    <span class="stat-label">Over</span>
                </div>
                <div class="stat-item total">
                    <span class="number" id="totalStat">0</span>
                    <span class="stat-label">Total</span>
                </div>
            </div>
            
            <!-- Footer -->
            <div class="footer">
                ⚡ Signal Bot v2.0 &bull; <span>Auto-saves</span> to Firebase
            </div>
        </div>
        
    </div>
</body>
</html>
